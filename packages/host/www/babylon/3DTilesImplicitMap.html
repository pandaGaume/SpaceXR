<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Implicit 3D Tiles surface (MapZen scheme)</title>
        <script src="../libs/babylon.js"></script>
        <script src="../libs/stellar_landscape_xr.1.0.0.js"></script>

        <style>
            html,
            body {
                background-color: rgb(4, 6, 12);
                overflow: hidden;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                font-family: sans-serif;
                color: #ddd;
            }
            #mapcontainer {
                position: relative;
                width: 100%;
                height: 100%;
            }
            #mapcontainer canvas {
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            .panel {
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgba(0, 0, 0, 0.55);
                padding: 12px 14px;
                border-radius: 8px;
                font-size: 13px;
                line-height: 1.5;
                z-index: 2;
                min-width: 300px;
            }
            .panel h2 {
                margin: 0 0 8px 0;
                font-size: 14px;
            }
            .panel label {
                display: block;
                margin-top: 8px;
                font-size: 12px;
                color: #aaa;
            }
            #status {
                margin-top: 8px;
                font-size: 12px;
                color: #9c9;
            }
            #stats {
                margin-top: 4px;
                font-size: 12px;
                color: #cc9;
            }
        </style>
    </head>

    <body>
        <div id="mapcontainer">
            <div class="panel">
                <h2>Implicit 3D Tiles surface</h2>
                <div>
                    A global z/x/y imagery pyramid (EPSG:3857, the MapZen scheme) navigated as a standard 3D Tiles
                    <b>implicit</b> tileset, driven by <code>Tile3dStreamSource</code> on the globe.
                </div>
                <label><input type="checkbox" id="wire" /> show tile outlines</label>
                <div id="status">Starting…</div>
                <div id="stats"></div>
            </div>
        </div>

        <script>
            /* global SPACEXR, BABYLON */
            const statusEl = document.getElementById("status");
            const statsEl = document.getElementById("stats");
            const wireEl = document.getElementById("wire");

            // Keyless, CORS-enabled cartography imagery (same z/x/y EPSG:3857
            // scheme as MapZen Terrarium). ESRI order is {z}/{y}/{x}.
            const imageryUri = (level, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${level}/${y}/${x}`;

            const ellipsoid = SPACEXR.Ellipsoid.WGS84;

            const canvas = document.createElement("canvas");
            document.getElementById("mapcontainer").appendChild(canvas);
            const engine = new BABYLON.Engine(canvas, true, { useHighPrecisionMatrix: true });
            const scene = new BABYLON.Scene(engine);
            scene.useRightHandedSystem = true;
            scene.clearColor = new BABYLON.Color4(0.02, 0.03, 0.06, 1);

            // Encapsulate the tile server as an implicit 3D Tiles tileset:
            // any ITileMetrics -> implicit QUADTREE provider (regions computed
            // from the metrics, so Web Mercator is handled exactly).
            const provider = new SPACEXR.MetricsImplicitTilesetProvider({
                metrics: new SPACEXR.EPSG3857({ maxLOD: 17 }),
                contentUri: imageryUri,
                availableLevels: 18,
            });

            const source = new SPACEXR.Tile3dStreamSource({
                id: "esri-world-imagery",
                implicitProvider: provider,
                ellipsoid: ellipsoid,
                maxScreenSpaceError: 32,
                maxRefinePerFrame: 16,
            });

            const loader = new SPACEXR.EllipsoidImageryTileLoader(scene);
            const binding = new SPACEXR.Tile3dStreamBinding(source, loader);
            const patches = new SPACEXR.EllipsoidTilePatchScene("patches", scene, ellipsoid, { tessellation: 10 });
            binding.linkTo(patches);

            wireEl.addEventListener("change", () => {
                patches.wireframe = wireEl.checked;
            });

            const camera = new SPACEXR.GeodeticCamera("camera", scene, new SPACEXR.GeodeticSystem(ellipsoid));
            camera.attachControl(canvas, true);
            camera.setGeodeticPosition(46.2, 6.15, 9_000_000); // over the Alps / Geneva

            // Planet-scale near/far, refreshed from altitude BEFORE the pump reads
            // the camera each frame (registered first). Log-depth on the patches
            // keeps precision across the huge range.
            const R = ellipsoid.semiMajorAxis;
            scene.onBeforeRenderObservable.add(() => {
                const d = camera.globalPosition.length();
                camera.minZ = Math.max(1, (camera.alt ?? 1000) / 1000);
                camera.maxZ = (d + R) * 1.25;
            });

            const pump = new SPACEXR.CameraStreamPump(scene, camera, source);

            source.rootReadyObservable.addOnce(() => {
                statusEl.textContent = "Navigate: zoom in to refine, zoom out to coarsen.";
            });

            engine.runRenderLoop(() => {
                scene.render();
                const n = scene.meshes.filter((m) => m.name.startsWith("patch ")).length;
                statsEl.textContent = `patches: ${n}  |  fps: ${Math.round(engine.getFps())}  |  alt: ${Math.round((camera.alt ?? 0) / 1000)} km`;
            });
            window.addEventListener("resize", () => engine.resize());
        </script>
    </body>
</html>
