ef mesuré.</text><text x="960" y="692.4" fill="#172f40" font-family="Calibri,sans-serif" font-size="28" font-weight="400" text-anchor="start">La normale et le rayon diffèrent</text><text x="960" y="732.4" fill="#172f40" font-family="Calibri,sans-serif" font-size="28" font-weight="400" text-anchor="start">sur un ellipsoïde aplati.</text><text x="75" y="85.4" fill="#172f40" font-family="Calibri,sans-serif" font-size="38" font-weight="700" text-anchor="start">Une adresse indépendante de la forme du corps</text></svg>