<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Exemple de dessin de tuiles sur canvas</title>
        <script src="../libs/spacexr.1.0.0.js"></script>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                font-family: sans-serif;
                background: #111;
            }
            #tileCanvas {
                width: 100%;
                height: 100%;
                display: block;
                touch-action: none; /* clé pour que pointermove fonctionne */
                background: #000;
            }
            #compass {
                width: 10vw;
                max-width: 200px;
                min-width: 32px;
                position: absolute;
                top: 20px;
                right: 20px;
                transform-origin: center;
            }
            #compassImage {
                width: 100%;
                height: 100%;
            }
            #layerPanel {
                position: absolute;
                top: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.75);
                color: #fff;
                padding: 12px 16px;
                border-radius: 8px;
                max-height: calc(100vh - 60px);
                overflow-y: auto;
                min-width: 180px;
                user-select: none;
            }
            #layerPanel h3 {
                margin: 0 0 8px 0;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                opacity: 0.7;
            }
            .layer-group {
                margin-bottom: 10px;
            }
            .layer-group-title {
                font-size: 12px;
                font-weight: bold;
                margin-bottom: 4px;
                opacity: 0.6;
                text-transform: uppercase;
            }
            .layer-option {
                display: block;
                padding: 6px 8px;
                margin: 2px 0;
                cursor: pointer;
                border-radius: 4px;
                font-size: 13px;
                transition: background 0.15s;
            }
            .layer-option:hover {
                background: rgba(255, 255, 255, 0.15);
            }
            .layer-option.active {
                background: rgba(255, 255, 255, 0.25);
            }
            .layer-option input[type="radio"] {
                margin-right: 8px;
                accent-color: #4fc3f7;
            }
            #attribution {
                position: absolute;
                bottom: 4px;
                right: 8px;
                font-size: 11px;
                color: rgba(255, 255, 255, 0.7);
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="mapContainer">
            <canvas id="tileCanvas"></canvas>
            <div id="compass">
                <img id="compassImage" src="../images/compass.png" alt="Compass" />
            </div>
            <div id="layerPanel">
                <h3>Layers</h3>
                <div class="layer-group">
                    <div class="layer-group-title">Earth</div>
                    <label class="layer-option active">
                        <input type="radio" name="layer" value="google_satellite" checked />Satellite
                    </label>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="google_street" />Street
                    </label>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="google_hybrid" />Hybrid
                    </label>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="google_terrain" />Terrain
                    </label>
                </div>
                <div class="layer-group">
                    <div class="layer-group-title">Moon</div>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="moon_basemap" />Basemap
                    </label>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="moon_hillshade" />Hillshade Albedo
                    </label>
                </div>
                <div class="layer-group">
                    <div class="layer-group-title">Mars</div>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="mars_basemap" />Basemap
                    </label>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="mars_mola_color" />MOLA Color
                    </label>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="mars_mola_gray" />MOLA Gray
                    </label>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="mars_surface" />Surface
                    </label>
                </div>
                <div class="layer-group">
                    <div class="layer-group-title">Mercury</div>
                    <label class="layer-option">
                        <input type="radio" name="layer" value="mercury_basemap" />MESSENGER Basemap
                    </label>
                </div>
            </div>
            <div id="attribution"></div>
        </div>
        <script>
            window.onload = () => {
                const canvas = document.getElementById("tileCanvas");
                const attributionEl = document.getElementById("attribution");

                // Layer catalog: each entry defines the tile client factory, attribution, default center & zoom
                // Client factories are lazy (functions) so no error at init time if a vendor is missing.
                const layerCatalog = {
                    // ── Earth ──
                    google_satellite: {
                        client: () => SPACEXR.Google.SatelliteClient2d(),
                        attribution: SPACEXR.Google.Attribution,
                        center: [27.988, 86.925],
                        zoom: 12,
                    },
                    google_street: {
                        client: () => SPACEXR.Google.StreetClient2d(),
                        attribution: SPACEXR.Google.Attribution,
                        center: [27.988, 86.925],
                        zoom: 12,
                    },
                    google_hybrid: {
                        client: () => SPACEXR.Google.HybridClient2d(),
                        attribution: SPACEXR.Google.Attribution,
                        center: [27.988, 86.925],
                        zoom: 12,
                    },
                    google_terrain: {
                        client: () => SPACEXR.Google.TerrainClient2d(),
                        attribution: SPACEXR.Google.Attribution,
                        center: [27.988, 86.925],
                        zoom: 12,
                    },
                    // ── Moon ──
                    moon_basemap: {
                        client: () => SPACEXR.Moon.BasemapClient(),
                        attribution: SPACEXR.Moon.Attribution,
                        center: [0, 0],
                        zoom: 3,
                    },
                    moon_hillshade: {
                        client: () => SPACEXR.Moon.HillshadeClient(),
                        attribution: SPACEXR.Moon.Attribution,
                        center: [0, 0],
                        zoom: 3,
                    },
                    // ── Mars ──
                    mars_basemap: {
                        client: () => SPACEXR.Mars.BasemapClient(),
                        attribution: SPACEXR.Mars.Attribution,
                        center: [0, 0],
                        zoom: 3,
                    },
                    mars_mola_color: {
                        client: () => SPACEXR.Mars.MOLAColorClient(),
                        attribution: SPACEXR.Mars.Attribution,
                        center: [0, 0],
                        zoom: 3,
                    },
                    mars_mola_gray: {
                        client: () => SPACEXR.Mars.MOLAGrayClient(),
                        attribution: SPACEXR.Mars.Attribution,
                        center: [0, 0],
                        zoom: 3,
                    },
                    mars_surface: {
                        client: () => SPACEXR.Mars.SurfaceClient(),
                        attribution: SPACEXR.Mars.Attribution,
                        center: [0, 0],
                        zoom: 3,
                    },
                    // ── Mercury ──
                    mercury_basemap: {
                        client: () => SPACEXR.Mercury.BasemapClient(),
                        attribution: SPACEXR.Mercury.Attribution,
                        center: [0, 0],
                        zoom: 3,
                    },
                };

                // Build the map — don't set a default view yet, setLayer will do it
                const map = new SPACEXR.CanvasMap(canvas);
                let currentLayer = null;

                function setLayer(key) {
                    const def = layerCatalog[key];
                    if (!def) return;

                    // ── Tear-down: dispose old layer and remove it from the map ──
                    if (currentLayer) {
                        map.layers.remove(currentLayer);
                        currentLayer.dispose();
                        currentLayer = null;
                    }

                    // ── Build the new layer ──
                    const tileClient = def.client();
                    currentLayer = new SPACEXR.ImageLayer(key, tileClient, { attribution: def.attribution });
                    currentLayer.addTo(map);

                    // Reset the view for this body
                    map.setViewMap(def.center, def.zoom, 0);

                    // Update attribution display
                    attributionEl.textContent = def.attribution;

                    // Update active styling
                    document.querySelectorAll(".layer-option").forEach((el) => el.classList.remove("active"));
                    const activeRadio = document.querySelector('input[name="layer"][value="' + key + '"]');
                    if (activeRadio) {
                        activeRadio.checked = true;
                        activeRadio.closest(".layer-option").classList.add("active");
                    }
                }

                // Initialize with Google Satellite
                setLayer("google_satellite");

                // Listen for layer changes
                document.querySelectorAll('input[name="layer"]').forEach((radio) => {
                    radio.addEventListener("change", (e) => setLayer(e.target.value));
                });

                // Compass
                function updateCompassRotation(bearing) {
                    document.getElementById("compass").style.transform = "rotate(" + bearing + "deg)";
                }

                document.getElementById("compass").addEventListener("click", () => {
                    map.setViewMap(undefined, undefined, 0);
                    updateCompassRotation(0);
                });

                map.navigationState.propertyChangedObservable.add((p) => {
                    if (p.propertyName === "azimuth") {
                        updateCompassRotation(p.newValue?.value ?? 0);
                    }
                });

                // Animation loop
                function updateFrame() {
                    map.validate();
                    requestAnimationFrame(updateFrame);
                }
                requestAnimationFrame(updateFrame);
            };
        </script>
    </body>
</html>
